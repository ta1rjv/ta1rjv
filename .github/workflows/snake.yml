name: Generate Contribution Snake

on:
  schedule:
    - cron: "23 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Prepare generated files
        run: |
          mkdir -p /tmp/snake-output
          cp dist/github-contribution-grid-snake.svg /tmp/snake-output/
          cp dist/github-contribution-grid-snake-dark.svg /tmp/snake-output/

      - name: Publish to output branch
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git switch -C output origin/output
          else
            git switch --orphan output
          fi

          git rm -rf . || true

          cp /tmp/snake-output/github-contribution-grid-snake.svg .
          cp /tmp/snake-output/github-contribution-grid-snake-dark.svg .

          git add github-contribution-grid-snake.svg
          git add github-contribution-grid-snake-dark.svg

          git commit -m "chore: update contribution snake" || true

          git push origin output
