name: Generate Stats Cards

on:
  schedule: [{cron: "0 3 * * *"}]   # her gün 03:00 UTC
  workflow_dispatch:
  push: {branches: [main]}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: GitHub Stats Card
        uses: lowlighter/metrics@latest
        with:
          filename: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          config_timezone: Europe/Istanbul
          theme: github_dark
          # İstersen buradan renkleri özelleştir:
          # config_order: languages, activity
          # extras_css: |
          #   .container { border-radius: 12px; }

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update stats cards"; then git push; fi
